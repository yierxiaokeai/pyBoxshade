[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyboxshade-modern"
version = "2.0.0"
description = "Desktop sequence alignment shading with live preview and vector export"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["PyQt5>=5.15.11,<6", "biopython>=1.85,<2", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "wheel", "pyinstaller>=6", "pypdf>=5"]

[project.gui-scripts]
pyboxshade = "pyboxshade.cli:main"

[tool.setuptools]
py-modules = ["BS_app", "BS_config", "OutDevs", "mydialog"]

[tool.setuptools.packages.find]
include = ["pyboxshade*"]

[tool.setuptools.package-data]
pyboxshade = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
